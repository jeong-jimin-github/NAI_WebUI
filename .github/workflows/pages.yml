name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static Pages build
        run: |
          sed -i 's|href="/styles.css"|href="./styles.css"|' public/index.html
          sed -i 's|<script type="module" src="/app.js"></script>|<script src="./static-adapter.js"></script><script type="module" src="./app.js"></script>|' public/index.html
          sed -i 's|키와 비밀번호는 이 서버 외부에 저장되지 않습니다.|키와 비밀번호는 브라우저에서만 처리되며 별도 서버로 전송하지 않습니다.|' public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
