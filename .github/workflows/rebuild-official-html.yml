name: Rebuild exact NovelAI HTML

on:
  push:
    paths:
      - '.nai-official-html/**'
      - '.github/workflows/rebuild-official-html.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact saved HTML
        shell: bash
        run: |
          set -euo pipefail
          cat .nai-official-html/part-*.b64 | tr -d '\n\r' | base64 -d | gzip -d > public/index.html
          echo "24ed3bf3fe866ec75412a53b6126bc271f297219c1002692c9934fecdda3a919  public/index.html" | sha256sum -c -
          test "$(wc -c < public/index.html)" -eq 197902

      - name: Commit exact HTML
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/index.html; then
            echo "public/index.html is already byte-for-byte identical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Restore exact saved NovelAI V5 HTML"
          git push
