<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Generation · NAI WebUI</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="app-header"><div class="brand">NAI<span>WebUI</span></div><nav class="header-nav"><button class="nav-link active">Image Generation</button><button class="nav-link">Quick Start Gallery</button><button class="nav-link">Director Tools</button></nav><div class="header-status"><span class="tier-dot"></span>Opus Tier</div></header>
<div class="workspace"><aside class="control-panel"><div class="panel-topbar"><button class="icon-button">‹</button><div class="anlas-pill"><span>Anlas</span><strong>3414</strong></div><button class="icon-button">☰</button></div>
<section class="setting-section compact-row"><label>Model<select><option>V5 Full</option><option>V5 Lite</option></select></label><label>Mode<button class="mode-select">Anime <span>⌄</span></button></label></section>
<section class="setting-section prompt-section"><div class="tab-bar"><button class="prompt-tab active" data-target="base-prompt">Base Prompt</button><button class="prompt-tab" data-target="negative-prompt">Undesired Content</button></div><div class="prompt-pane active" id="base-prompt"><textarea id="prompt" placeholder="Type tags or a prompt…"></textarea><div class="prompt-options"><label class="toggle"><input type="checkbox"> Transparent BG</label><select><option>Quality Tags: None</option><option>Quality Tags: Full</option></select></div></div><div class="prompt-pane" id="negative-prompt"><textarea id="negative" placeholder="Describe what to avoid…"></textarea><select><option>UC Preset: Heavy</option><option>UC Preset: Light</option></select></div></section>
<section class="setting-section card-section"><div class="section-title"><span>Character Prompts</span><button class="small-icon" id="add-character">＋</button></div><p>Create a separate prompt for characters in your scene.</p><div class="segmented-control" id="position-mode"><button class="active">AI's Choice</button><button>Custom</button></div><div id="character-list"><div class="character-card"><div class="character-heading"><input placeholder="Character 1"><button class="small-icon remove-character">×¬</button></div><textarea placeholder="Character prompt…"></textarea></div></div></section>
<section class="setting-section card-section"><div class="section-title"><span>Reference Images</span><button class="small-icon" id="upload-reference">＋</button></div><input id="reference-input" type="file" accept="image/*" multiple hidden><button class="upload-row" id="reference-trigger"><span>▧</span><span><strong>Image2Image</strong><small>Transform your image.</small></span><span class="plus">＋</span></button></section>
<section class="setting-section"><div class="section-title">Image Settings</div><label>Resolution<div class="resolution-row"><input id="width" type="number" value="832" step="64"><button id="swap-resolution" class="small-icon">⇄</button><input id="height" type="number" value="1216" step="64"></div></label><select><option>Normal</option><option>Portrait</option><option>Landscape</option></select><label>Number of Images</label><div class="count-control" id="image-count"><button class="active">1</button><button>2</button><button>3</button><button>4</button></div></section>
<section class="setting-section advanced-settings"><label>Steps <div class="range-row"><input type="range" min="1" max="50" value="28"><output>28</output></div></label><label>Guidance <div class="range-row"><input type="range" min="1" max="20" value="6"><output>6</output></div></label><label>Seed <div class="seed-row"><input type="text" value="-1"><button class="small-icon">⌘</button></div></label><label>Sampler<select><option>Euler Ancestral</option><option>Euler</option></select></label></section>
<div class="panel-footer"><div class="usage"><strong>75%</strong> of Opus Generations remaining<div class="usage-bar"><span></span></div></div><button id="generate" class="generate-button"><span>Generate <b id="generate-count">1 Image</b></span><small><b>0</b> ◈ Anlas</small></button></div></aside>
<main class="output-panel"><div class="output-toolbar"><button class="icon-button">‹</button><span>Image Generation</span><div>◷ ⚙</div></div><section class="welcome-state" id="welcome-state"><span class="eyebrow">NAI WebUI</span><h1>Get Started</h1><p>Enter a prompt, choose settings, and create your next image.</p><div class="quick-grid"><button class="quick-card" data-prompt="1girl, cinematic lighting, detailed anime illustration"><span class="quick-art purple"></span><strong>Anime portrait</strong><small>Click to copy prompt</small></button><button class="quick-card" data-prompt="fantasy city at sunset, richly detailed, atmospheric"><span class="quick-art gold"></span><strong>Fantasy landscape</strong><small>Click to copy prompt</small></button><button class="quick-card" data-prompt="mecha design, technical illustration, dramatic angle"><span class="quick-art teal"></span><strong>Mecha concept</strong><small>Click to copy prompt</small></button></div></section><section id="results" class="results" hidden></section></main></div><script src="ui-fixes.js"></script></body></html>
